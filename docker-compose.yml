services:
  mongo:
    image: mongo:7.0
    container_name: quiz-mongo
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: quiz
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: quiz-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 2s
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: quiz-minio
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Admin console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - minio_data:/data

  # Optional - auto create "quiz-assets" bucket on first `docker compose up`.
  minio-init:
    image: minio/mc:latest
    container_name: quiz-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      (mc mb local/quiz-assets || true) &&
      mc anonymous set download local/quiz-assets &&
      echo 'MinIO bucket quiz-assets ready.'
      "

volumes:
  mongo_data:
  redis_data:
  minio_data:
