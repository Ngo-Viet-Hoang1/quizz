name: CD - Deploy to AWS EC2

on:
  push:
    branches: [dev1, main]

concurrency:
  group: deploy-ec2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Fast Zero-Downtime Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Execute Remote Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.EC2_USER || 'ubuntu' }}@${{ secrets.EC2_HOST }} '
            set -e
            export PATH=$PATH:/home/ubuntu/.local/share/pnpm:/usr/local/bin:/usr/bin:/bin
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "🚀 [1/5] Moving to project directory..."
            cd /home/ubuntu/quizz-app

            echo "📥 [2/5] Fetching latest changes for branch: ${{ github.ref_name }}..."
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "📦 [3/5] Installing dependencies with cached store..."
            pnpm install --frozen-lockfile --prefer-offline

            echo "⚡ [4/5] Building applications with Turborepo..."
            pnpm turbo run build

            echo "🔄 [5/5] Performing Zero-Downtime PM2 reload..."
            pm2 reload ecosystem.config.js --update-env || pm2 restart ecosystem.config.js --update-env

            echo "✅ Deployment completed successfully!"
          '
