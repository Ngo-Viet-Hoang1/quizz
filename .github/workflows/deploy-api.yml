name: Deploy API
on:
  push:
    branches: [main]

jobs:
  migrate-then-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      - name: Run migration (production)
        run: pnpm --filter @repo/api migrate:up
        env:
          MONGODB_URI: ${{ secrets.MONGO_PROD_URI }}

      - name: Install Render CLI
        run: |
          curl -L https://render.com/download-cli/linux -o render-cli
          chmod +x render-cli
          sudo mv render-cli /usr/local/bin/render

      - name: Trigger Render deploy and wait
        run: render deploys create ${{ secrets.RENDER_SERVICE_ID }} --wait --output json
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
