name: CD - Deploy to AWS EC2

on:
  push:
    branches: [dev1, main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Fast Zero-Downtime Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Execute Remote Deploy on EC2
        env:
          RAW_HOST: ${{ secrets.EC2_HOST }}
          RAW_USER: ${{ secrets.EC2_USER }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          TARGET_HOST=$(echo "$RAW_HOST" | tr -d '[:space:]')
          TARGET_USER=$(echo "$RAW_USER" | tr -d '[:space:]')
          TARGET_USER="${TARGET_USER:-ubuntu}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${TARGET_USER}@${TARGET_HOST}" "bash /home/ubuntu/quizz-app/scripts/deploy.sh ${BRANCH_NAME}"
